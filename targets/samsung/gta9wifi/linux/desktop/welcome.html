<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBL Linux desktop</title>
<style>body{font:20px system-ui,sans-serif;background:#111820;color:#edf4fa;margin:0;padding:7vw}main{max-width:45rem;margin:auto}h1{font-size:2.3rem}button,input{font:inherit;padding:.8rem;border-radius:.4rem;border:1px solid #667788}button{background:#2c7db8;color:white;cursor:pointer}#status{padding:1rem 0;color:#91d4b1}p{line-height:1.6}input{max-width:90%}</style>
<main><h1>KBL Linux desktop</h1><p>This page is running in the Linux browser. Use the controls to check text entry, pointer or direct touch input.</p>
<label>Type here <input placeholder="Keyboard or on-screen input" aria-label="Input test"></label>
<p><button id="test">Test interaction</button></p><div id="status" aria-live="polite">Waiting for input.</div>
<p>This local page works offline. Opening a website separately tests network access.</p></main>
<script>let n=0;document.querySelector('#test').addEventListener('click',()=>{document.querySelector('#status').textContent=`Interaction received (${++n}). JavaScript is running.`})</script></html>
